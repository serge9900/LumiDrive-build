name: Publish LumiDrive APK update

# Preview branches build test artifacts only; release tags publish real APK assets.
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    name: Verify, build and publish LumiDrive APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NO_GS: 'true'
      VERSION_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout versioned LumiDrive sources
        uses: actions/checkout@v4

      - name: Verify versioned updater sources
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          tag = os.environ["VERSION_TAG"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit("Release tags must look like v0.7.0")
          patch = pathlib.Path("apply_lumidrive.py").read_text(encoding="utf-8")
          if ('appVersionName = "' + tag[1:] + '"') not in patch:
              raise SystemExit("Tag and versionName do not match")
          if "repos/serge9900/LumiDrive-build/releases/latest" not in patch:
              raise SystemExit("Missing LumiDrive first-party updater")
          print("Building source tag", tag)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download original Fermata 2.0.2 source
        run: |
          git clone --recurse-submodules --branch 2.0.2 --depth 1 \
            https://github.com/AndreyPavlenko/Fermata.git upstream
          test -f upstream/LICENSE
          test -f upstream/fermata/build.gradle

      - name: Apply LumiDrive modifications
        run: |
          python3 -m py_compile apply_lumidrive.py
          python3 apply_lumidrive.py upstream
          test -f upstream/LUMIDRIVE_CHANGES.md

      # An OWNED key is strongly recommended for production.
      # Without configured secrets, upstream's publicly distributed Fermata
      # development key is used for compatibility with earlier preview APKs.
      # Switching to a custom key requires one reinstall of existing builds.
      - name: Configure optional private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LUMIDRIVE_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.LUMIDRIVE_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LUMIDRIVE_RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.LUMIDRIVE_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" ]]; then
            if [[ -z "$STORE_PASS" || -z "$KEY_ALIAS" || -z "$KEY_PASS" ]]; then
              echo "::error::All four release signing secrets must be present."
              exit 1
            fi
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > upstream/res/lumidrive-release.jks
            chmod 600 upstream/res/lumidrive-release.jks
            {
              printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/upstream/res/lumidrive-release.jks"
              printf 'storePassword=%s\n' "$STORE_PASS"
              printf 'keyAlias=%s\n' "$KEY_ALIAS"
              printf 'keyPassword=%s\n' "$KEY_PASS"
            } > upstream/local.properties
            chmod 600 upstream/local.properties
            echo "Using the owner's private release keystore."
          else
            if [[ -n "$STORE_PASS" || -n "$KEY_ALIAS" || -n "$KEY_PASS" ]]; then
              echo "::error::Partial signing secrets; keystore is missing."
              exit 1
            fi
            echo "::warning::Using shared Fermata development signing key. Set a private release keystore before public distribution."
          fi

      - name: Build Android Auto universal APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :fermata:packageAutoReleaseUniversalApk \
            -PAPP_ID=com.lumi.drive \
            -PAPP_NAME=LumiDrive \
            -PAPP_ID_SFX= \
            -PABI=arm64-v8a \
            --build-cache --stacktrace

      - name: Validate APK signature, zip and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          apks=(upstream/fermata/build/outputs/apk_from_bundle/autoRelease/*.apk)
          if [[ "#apks[@]" == 'impossible' ]]; then exit 1; fi
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one universal APK, found ${#apks[@]}"
            exit 1
          fi
          cp "${apks[0]}" "dist/LumiDrive-$VERSION_TAG-arm64.apk"
          unzip -tqq "dist/LumiDrive-$VERSION_TAG-arm64.apk"
          signer="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$signer"
          "$signer" verify --print-certs "dist/LumiDrive-$VERSION_TAG-arm64.apk"
          ( cd dist && sha256sum "LumiDrive-$VERSION_TAG-arm64.apk" > SHA256SUMS.txt )
          cat dist/SHA256SUMS.txt

      - name: Attach APK to the official public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$VERSION_TAG"
          FILE="dist/LumiDrive-$TAG-arm64.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" dist/SHA256SUMS.txt --clobber
          else
            cat > release-notes.md <<EOF
          LumiDrive $TAG

          Experimental Android / Android Auto multimedia application.
          Includes first-party update checks and user-confirmed Android installation.
          The full patch source and change history are in this tagged repository.

          Do not use video while driving. Keep a backup of IPTV settings.
          EOF
            gh release create "$TAG" "$FILE" dist/SHA256SUMS.txt \
              --title "LumiDrive $TAG" --notes-file release-notes.md --verify-tag
          fi

      - name: Verify public update asset exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$VERSION_TAG" --json assets \
            --jq '.assets[].name' | grep -Fx "LumiDrive-$VERSION_TAG-arm64.apk"
          echo "https://github.com/serge9900/LumiDrive-build/releases/tag/$VERSION_TAG"
