name: Build LumiDrive APK

on:
  workflow_dispatch:
  push:
    branches:
      - lumidrive-v0.4-ui
      - lumidrive-v0.5-home
      - lumidrive-v0.5.1-ui-fixes
      - lumidrive-v0.5.2-nav-home
      - lumidrive-v0.5.3-toolbar-fix
      - lumidrive-v0.5.4-binance-support
      - lumidrive-v0.5.5-yandex-web
      - lumidrive-v0.5.6-no-aa-autoplay
      - lumidrive-v0.5.7-mirror-icons
      - lumidrive-v0.6.0-auto-home
      - lumidrive-v0.6.1-developer-name
      - lumidrive-v0.7.0-updater
      - lumidrive-v0.7.1-updates-and-logs
      - lumidrive-v0.7.2-diagnostics
      - lumidrive-v0.7.3-dialog-contrast
      - lumidrive-v0.7.4-updater-diagnostics
      - lumidrive-v0.7.5-release-test
      - lumidrive-v0.7.6-update-icon
      - lumidrive-v0.7.7-browser-update-filename
      - lumidrive-v0.7.8-download-notification-icon
      - lumidrive-v0.7.12-car-iptv
      - lumidrive-v0.8.0-style-preview

permissions:
  contents: read

jobs:
  build:
    name: LumiDrive Android Auto arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NO_GS: 'true'
    steps:
      - name: Checkout LumiDrive build tools
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test diagnostics privacy and filtering (pure Java)
        run: |
          set -euo pipefail
          mkdir -p build/log-tests
          javac -encoding UTF-8 -d build/log-tests \
            src/LumiDriveLogTools.java tests/LumiDriveLogToolsTest.java
          java -cp build/log-tests LumiDriveLogToolsTest

      - name: Test release HTTP retry and incomplete responses
        run: |
          mkdir -p build/http-tests
          javac -d build/http-tests src/LumiDriveReleaseHttp.java tests/LumiDriveReleaseHttpTest.java
          java -cp build/http-tests LumiDriveReleaseHttpTest

      - name: Test country catalog
        run: |
          mkdir -p build/world-tests
          javac -encoding UTF-8 -d build/world-tests src/LumiWorldCountries.java tests/LumiWorldCountriesTest.java
          java -cp build/world-tests LumiWorldCountriesTest

      - name: Download Fermata 2.0.2 source
        run: |
          git clone --recurse-submodules --branch 2.0.2 --depth 1 \
            https://github.com/AndreyPavlenko/Fermata.git upstream
          test -f upstream/LICENSE
          test -f upstream/fermata/build.gradle

      - name: Apply LumiDrive v0.7.12 car dashboard only
        run: |
          python3 -m py_compile apply_lumidrive.py
          python3 apply_lumidrive.py upstream
          python3 apply_world_tv.py upstream
          test -f upstream/LUMIDRIVE_CHANGES.md

      - name: Apply visual skin and verify behavior files are unchanged
        run: |
          python3 -m py_compile apply_style_refresh.py
          python3 apply_style_refresh.py upstream
          python3 -m py_compile apply_internal_design.py
          python3 apply_internal_design.py upstream
          python3 -m py_compile apply_themes.py
          python3 apply_themes.py upstream
          python3 tests/validate_themes.py upstream

      - name: Build universal Android Auto APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :fermata:packageAutoReleaseUniversalApk \
            -PAPP_ID=com.lumi.drive \
            -PAPP_NAME=LumiDrive \
            -PAPP_ID_SFX= \
            -PABI=arm64-v8a \
            --build-cache --stacktrace

      - name: Validate and name test APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          apks=(upstream/fermata/build/outputs/apk_from_bundle/autoRelease/*.apk)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "Expected 1 APK; got ${#apks[@]}" >&2
            find upstream/fermata/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi
          cp "${apks[0]}" dist/LumiDrive-v0.8.0-preview3-arm64.apk
          unzip -tqq dist/LumiDrive-v0.8.0-preview3-arm64.apk
          sha256sum dist/LumiDrive-v0.8.0-preview3-arm64.apk > dist/SHA256SUMS.txt
          ls -lh dist/LumiDrive-v0.8.0-preview3-arm64.apk

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumiDrive-v0.8.0-preview3-APK-arm64
          path: |
            dist/LumiDrive-v0.8.0-preview3-arm64.apk
            dist/SHA256SUMS.txt

          retention-days: 30
          if-no-files-found: error
