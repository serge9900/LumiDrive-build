name: Build LumiDrive APK

on:
  workflow_dispatch:
  push:
    branches:
      - lumidrive-v0.4-ui
      - lumidrive-v0.5-home
      - lumidrive-v0.5.1-ui-fixes
      - lumidrive-v0.5.2-nav-home
      - lumidrive-v0.5.3-toolbar-fix
      - lumidrive-v0.5.4-binance-support
      - lumidrive-v0.5.5-yandex-web
      - lumidrive-v0.5.6-no-aa-autoplay
      - lumidrive-v0.5.7-mirror-icons
      - lumidrive-v0.6.0-auto-home

permissions:
  contents: read

jobs:
  build:
    name: LumiDrive Android Auto arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NO_GS: 'true'
    steps:
      - name: Checkout LumiDrive build tools
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Fermata 2.0.2 source
        run: |
          git clone --recurse-submodules --branch 2.0.2 --depth 1 \
            https://github.com/AndreyPavlenko/Fermata.git upstream
          test -f upstream/LICENSE
          test -f upstream/fermata/build.gradle

      - name: Apply LumiDrive v0.6.0 Auto UI 1.0
        run: |
          python3 -m py_compile apply_lumidrive.py
          python3 apply_lumidrive.py upstream
          test -f upstream/LUMIDRIVE_CHANGES.md

      - name: Build universal Android Auto APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :fermata:packageAutoReleaseUniversalApk \
            -PAPP_ID=com.lumi.drive \
            -PAPP_NAME=LumiDrive \
            -PAPP_ID_SFX= \
            -PABI=arm64-v8a \
            --build-cache --stacktrace

      - name: Validate and name test APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          apks=(upstream/fermata/build/outputs/apk_from_bundle/autoRelease/*.apk)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo "Expected 1 APK; got ${#apks[@]}" >&2
            find upstream/fermata/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi
          cp "${apks[0]}" dist/LumiDrive-v0.6.0-arm64.apk
          unzip -tqq dist/LumiDrive-v0.6.0-arm64.apk
          sha256sum dist/LumiDrive-v0.6.0-arm64.apk > dist/SHA256SUMS.txt
          ls -lh dist/LumiDrive-v0.6.0-arm64.apk

      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumiDrive-v0.6.0-APK-arm64
          path: |
            dist/LumiDrive-v0.6.0-arm64.apk
            dist/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
